services:
  python-service:
    build: .
    container_name: marlabs-python-service
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  gateway:
    build:
      context: ./gateway
    container_name: marlabs-spring-gateway
    ports:
      - "8080:8080"
    environment:
      PYTHON_SERVICE_URL: http://python-service:8000
    depends_on:
      - python-service
